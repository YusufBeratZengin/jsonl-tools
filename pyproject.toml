[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonl-tools"
version = "0.1.0"
description = "Streaming command-line toolkit for large JSONL and .jsonl.gz files: head, tail, filter, select, stats, schema, split, sample, dedupe, validate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Berat Zengin" }]
requires-python = ">=3.10"
keywords = ["jsonl", "ndjson", "json-lines", "cli", "streaming", "dataset", "llm", "logs", "gzip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.17.1", "mypy>=1.10", "build", "twine"]

[project.scripts]
jsonl-tools = "jsonl_tools.cli:run"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/jsonl-tools"
Repository = "https://github.com/YusufBeratZengin/jsonl-tools"
Issues = "https://github.com/YusufBeratZengin/jsonl-tools/issues"
Changelog = "https://github.com/YusufBeratZengin/jsonl-tools/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonl_tools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", "README*.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["jsonl_tools"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.ruff.format]
line-ending = "lf"
