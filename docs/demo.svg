<svg xmlns="http://www.w3.org/2000/svg" width="820" height="578" viewBox="0 0 820 578" role="img" aria-labelledby="title description">
<title id="title">jsonl-tools terminal demo</title>
<desc id="description">Actual output: count records, filter errors, select fields and validate JSONL.</desc>
<rect width="820" height="578" rx="12" fill="#101827"/>
<text x="24" y="30" fill="#94a3b8" font-family="monospace" font-size="14">jsonl-tools | Python 3.10+ | zero runtime dependencies</text>
<text x="24" y="64" fill="#67e8f9" font-family="monospace" font-size="14" xml:space="preserve">$ jsonl-tools count examples/chat.jsonl</text>
<text x="24" y="87" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">12</text>
<text x="24" y="110" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve"></text>
<text x="24" y="133" fill="#67e8f9" font-family="monospace" font-size="14" xml:space="preserve">$ jsonl-tools filter examples/app.log.jsonl level==ERROR --count</text>
<text x="24" y="156" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">5</text>
<text x="24" y="179" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve"></text>
<text x="24" y="202" fill="#67e8f9" font-family="monospace" font-size="14" xml:space="preserve">$ jsonl-tools select examples/chat.jsonl id tokens=usage.tokens</text>
<text x="24" y="225" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-001&quot;,&quot;tokens&quot;:41}</text>
<text x="24" y="248" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-002&quot;,&quot;tokens&quot;:40}</text>
<text x="24" y="271" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-003&quot;,&quot;tokens&quot;:1150}</text>
<text x="24" y="294" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-004&quot;,&quot;tokens&quot;:41}</text>
<text x="24" y="317" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-005&quot;,&quot;tokens&quot;:52}</text>
<text x="24" y="340" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-006&quot;,&quot;tokens&quot;:57}</text>
<text x="24" y="363" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-007&quot;,&quot;tokens&quot;:19}</text>
<text x="24" y="386" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-008&quot;,&quot;tokens&quot;:65}</text>
<text x="24" y="409" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-009&quot;,&quot;tokens&quot;:31}</text>
<text x="24" y="432" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-010&quot;,&quot;tokens&quot;:52}</text>
<text x="24" y="455" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-011&quot;,&quot;tokens&quot;:1142}</text>
<text x="24" y="478" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">{&quot;id&quot;:&quot;ex-012&quot;,&quot;tokens&quot;:100}</text>
<text x="24" y="501" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve"></text>
<text x="24" y="524" fill="#67e8f9" font-family="monospace" font-size="14" xml:space="preserve">$ jsonl-tools validate examples/chat.jsonl</text>
<text x="24" y="547" fill="#e2e8f0" font-family="monospace" font-size="14" xml:space="preserve">12 line(s): 12 valid, 0 invalid</text>
</svg>
